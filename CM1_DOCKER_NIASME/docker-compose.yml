services:
  # n8n : L'outil d'automatisation
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.local/share/n8n

  # Ollama : L'IA qui tourne sur ta machine
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Si tu as une carte graphique NVIDIA, on pourra ajouter la config GPU après

volumes:
  n8n_data:
  ollama_data: